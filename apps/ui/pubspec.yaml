name: perechen_ui
description: >-
  Интерфейс ответственного за перечень «нежелательных организаций» (272-ФЗ):
  просмотр версий, проверка автоматического разбора, ручные правки и
  подтверждение выгрузки в CDI.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
