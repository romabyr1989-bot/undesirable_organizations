<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Перечень нежелательных организаций (272-ФЗ): проверка разбора и выгрузка в CDI">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <base href="$FLUTTER_BASE_HREF">
  <title>Перечень 272-ФЗ</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Служебный воркер Flutter кеширует сборку целиком и после обновления
    // службы продолжает показывать прежний интерфейс. Приложение внутреннее,
    // офлайн-режим не нужен — снимаем регистрацию и чистим кеши.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(function (registrations) {
          registrations.forEach(function (r) { r.unregister(); });
        })
        .catch(function () {});
      if (window.caches) {
        caches.keys()
          .then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); })
          .catch(function () {});
      }
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
